<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">窩牛 × Takara 一年內容產製、發布與搜尋成長引擎</title>
  <desc id="map-desc">窩牛本業與 Takara 代理雙主線，透過二十四次到場採集、策略選題與九十六支影音產製，發布至四個影音平台，再延伸九十六組短文至網站、三個指定社團及 Threads，並於下半年完成六篇 SEO／AEO 深度文章。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f3ea"/><stop offset="1" stop-color="#eadfce"/></linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16120f"/><stop offset="1" stop-color="#39241b"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#16120f" flood-opacity=".12"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="21"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .03"/></feComponentTransfer></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#a95732"/></marker>
    <style>
      .sans{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}.serif{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif}
      .ink{fill:#16120f}.muted{fill:#746e65}.white{fill:#fffaf3}.eyebrow{font-size:14px;font-weight:800;letter-spacing:3px}.node{fill:#fffdfa;stroke:#d9cdbc;stroke-width:1.4}.warm{fill:#f0e2ce;stroke:#c98d68;stroke-width:1.4}.sage{fill:#e3e8df;stroke:#9ba694;stroke-width:1.4}.line{fill:none;stroke:#a95732;stroke-width:2.2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/><rect width="1920" height="1080" filter="url(#grain)" opacity=".55"/>
  <circle cx="1790" cy="34" r="230" fill="none" stroke="#a95732" opacity=".14"/><circle cx="1790" cy="34" r="170" fill="none" stroke="#a95732" opacity=".1"/>

  <text x="70" y="56" class="sans eyebrow" fill="#a95732">WONIU × TAKARA · YEAR ONE CONTENT OPERATING MAP</text>
  <text x="70" y="112" class="serif ink" font-size="44" font-weight="800">一年內容產製、發布與搜尋成長引擎</text>
  <text x="72" y="151" class="sans muted" font-size="19">把每一次現場專業，轉譯成影音、跨平台議題與可長期累積的搜尋內容</text>
  <g transform="translate(1585 69)"><text x="0" y="32" class="serif" fill="#a95732" font-size="58" font-weight="800">12</text><text x="76" y="11" class="sans muted" font-size="14" font-weight="750">MONTHS</text><text x="76" y="33" class="sans muted" font-size="14" font-weight="750">ONE SYSTEM</text></g>
  <path d="M70 181H1850" stroke="#cbb9a5" opacity=".62"/>

  <g filter="url(#shadow)"><rect x="70" y="214" width="1780" height="176" rx="25" fill="#fffdfa" stroke="#d9cdbc"/></g>
  <rect x="70" y="214" width="330" height="176" rx="25" fill="url(#dark)"/><rect x="370" y="214" width="30" height="176" fill="url(#dark)"/>
  <text x="104" y="252" class="sans eyebrow" fill="#d79069">CONTENT INPUTS</text>
  <text x="104" y="294" class="serif white" font-size="28" font-weight="800">雙主線真實素材</text>
  <text x="104" y="328" class="sans" fill="#d8cdbf" font-size="15">窩牛本業 × Takara 代理</text>
  <text x="104" y="357" class="sans" fill="#d8cdbf" font-size="15">案例・現場・展間・產品・原廠</text>
  <path d="M400 302H438" class="line"/>
  <rect x="450" y="238" width="310" height="128" rx="19" class="warm"/>
  <text x="605" y="271" class="sans" fill="#a95732" font-size="13" font-weight="800" text-anchor="middle">FIELD CAPTURE</text><text x="605" y="313" class="serif ink" font-size="29" font-weight="800" text-anchor="middle">24 次到場</text><text x="605" y="341" class="sans muted" font-size="14" text-anchor="middle">訪談・拍攝・專業內容確認</text>
  <path d="M760 302H792" class="line"/>
  <rect x="804" y="238" width="310" height="128" rx="19" class="node"/>
  <text x="959" y="271" class="sans" fill="#a95732" font-size="13" font-weight="800" text-anchor="middle">STRATEGY</text><text x="959" y="313" class="serif ink" font-size="27" font-weight="800" text-anchor="middle">選題與腳本轉譯</text><text x="959" y="341" class="sans muted" font-size="14" text-anchor="middle">把專業說成客戶聽得懂的內容</text>
  <path d="M1114 302H1146" class="line"/>
  <rect x="1158" y="238" width="310" height="128" rx="19" class="sage"/>
  <text x="1313" y="271" class="sans" fill="#687360" font-size="13" font-weight="800" text-anchor="middle">PRODUCTION</text><text x="1313" y="313" class="serif ink" font-size="29" font-weight="800" text-anchor="middle">96 支短影音</text><text x="1313" y="341" class="sans muted" font-size="14" text-anchor="middle">主要拍攝・剪輯・品質控管</text>
  <path d="M1468 302H1500" class="line"/>
  <rect x="1512" y="238" width="308" height="128" rx="19" fill="#f4ebe0" stroke="#cdb79d" stroke-width="1.4"/>
  <text x="1666" y="271" class="sans" fill="#a95732" font-size="13" font-weight="800" text-anchor="middle">VIDEO PUBLISHING</text><text x="1666" y="309" class="serif ink" font-size="24" font-weight="800" text-anchor="middle">FB・IG・YouTube・TikTok</text><text x="1666" y="341" class="sans muted" font-size="14" text-anchor="middle">完成影片確認後代上架</text>

  <text x="70" y="438" class="sans eyebrow" fill="#a95732">THE CONTENT DISTRIBUTION JOURNEY</text>
  <text x="1848" y="438" class="sans muted" font-size="13" text-anchor="end">同一份專業素材，沿著不同接觸點持續累積，而不是各平台各做一套</text>
  <g filter="url(#shadow)"><rect x="70" y="463" width="1780" height="350" rx="25" fill="#fffdfa" stroke="#d9cdbc"/></g>

  <rect x="94" y="497" width="318" height="112" rx="19" fill="#a95732"/>
  <text x="119" y="526" class="sans white" font-size="13" font-weight="800">01 · 建立觸及</text><text x="253" y="563" class="serif white" font-size="24" font-weight="800" text-anchor="middle">96 支短影音發布</text><text x="253" y="590" class="sans" fill="#f4ddd0" font-size="13" text-anchor="middle">四個影音平台建立第一接觸</text>
  <path d="M412 553H450" class="line"/>
  <rect x="452" y="497" width="318" height="112" rx="19" class="warm"/>
  <text x="477" y="526" class="sans" fill="#a95732" font-size="13" font-weight="800">02 · 延伸理解</text><text x="611" y="563" class="serif ink" font-size="24" font-weight="800" text-anchor="middle">96 組影音延伸短文</text><text x="611" y="590" class="sans muted" font-size="13" text-anchor="middle">每支影音對應一組文字內容</text>
  <path d="M770 553H808" class="line"/>
  <rect x="810" y="497" width="318" height="112" rx="19" class="node"/>
  <text x="835" y="526" class="sans" fill="#a95732" font-size="13" font-weight="800">03 · 多點擴散</text><text x="969" y="563" class="serif ink" font-size="24" font-weight="800" text-anchor="middle">網站・3 個社團・Threads</text><text x="969" y="590" class="sans muted" font-size="13" text-anchor="middle">同一內容組跨平台連動、不重複計件</text>
  <path d="M1128 553H1166" class="line"/>
  <rect x="1168" y="497" width="318" height="112" rx="19" class="sage"/>
  <text x="1193" y="526" class="sans" fill="#687360" font-size="13" font-weight="800">04 · 搜尋累積</text><text x="1327" y="563" class="serif ink" font-size="24" font-weight="800" text-anchor="middle">6 篇 SEO／AEO 深度文章</text><text x="1327" y="590" class="sans muted" font-size="13" text-anchor="middle">第 7–12 月逐月完成並上架</text>
  <path d="M1486 553H1524" class="line"/>
  <rect x="1526" y="497" width="300" height="112" rx="19" fill="url(#dark)"/>
  <text x="1551" y="526" class="sans" fill="#d79069" font-size="13" font-weight="800">05 · 市場成果</text><text x="1676" y="563" class="serif white" font-size="24" font-weight="800" text-anchor="middle">持續累積能見度與信任</text><text x="1676" y="590" class="sans" fill="#d8cdbf" font-size="13" text-anchor="middle">觸及 → 理解 → 搜尋 → 詢問</text>

  <path d="M611 609V654" class="line"/>
  <rect x="280" y="654" width="662" height="108" rx="19" fill="#f5eadc" stroke="#c98d68" stroke-width="1.4"/>
  <text x="306" y="684" class="sans" fill="#a95732" font-size="13" font-weight="800">CROSS-PLATFORM ISSUE MARKETING</text><text x="611" y="718" class="serif ink" font-size="23" font-weight="800" text-anchor="middle">讓影音議題進入網站、社團討論與 Threads 對話</text><text x="611" y="744" class="sans muted" font-size="13" text-anchor="middle">延長每一支影片的接觸時間，也讓同一主題被不同受眾看見</text>
  <path d="M942 708H980" class="line"/>
  <rect x="982" y="654" width="604" height="108" rx="19" fill="#e5e9e1" stroke="#9ba694" stroke-width="1.4"/>
  <text x="1008" y="684" class="sans" fill="#687360" font-size="13" font-weight="800">SEARCH DEPTH</text><text x="1284" y="718" class="serif ink" font-size="23" font-weight="800" text-anchor="middle">把市場問題整理成可被搜尋、引用與回答的內容</text><text x="1284" y="744" class="sans muted" font-size="13" text-anchor="middle">業主負責網站架構與優化；本方案負責文章研究、撰寫與上架</text>
  <path d="M1586 708H1660V609" class="line"/>
  <text x="94" y="790" class="sans muted" font-size="12">每週回報執行進度、每季檢核一次方向；題材比例與發布週次依素材成熟度彈性配置，以年度交付總量為準。</text>

  <rect x="70" y="841" width="840" height="172" rx="23" fill="#ead6bd" stroke="#c9a27b"/>
  <text x="96" y="872" class="sans eyebrow" fill="#a95732">12-MONTH DELIVERY</text>
  <text x="96" y="906" class="serif ink" font-size="22" font-weight="800">年度正式交付</text>
  <text x="96" y="941" class="sans" fill="#4f433a" font-size="15">96 支短影音　·　24 次到場　·　96 組影音延伸短文　·　6 篇 SEO／AEO</text>
  <text x="96" y="970" class="sans" fill="#4f433a" font-size="15">Facebook／Instagram／YouTube／TikTok　·　網站／3 個指定社團／Threads</text>
  <text x="96" y="997" class="sans muted" font-size="13">全年 4 次季度檢核｜準備期另行贈送，不計入 12 個月</text>

  <rect x="934" y="841" width="400" height="172" rx="23" fill="#fffdfa" stroke="#d3bda2"/>
  <text x="960" y="872" class="sans eyebrow" fill="#a95732">INVESTMENT</text>
  <text x="960" y="906" class="serif ink" font-size="22" font-weight="800">年度合作費用</text>
  <text x="960" y="941" class="sans muted" font-size="15">前 11 個月：NT$33,500／月</text>
  <text x="960" y="970" class="sans muted" font-size="15">第 12 個月：NT$31,500</text>
  <text x="960" y="999" class="serif" fill="#a95732" font-size="22" font-weight="800">年度合計 NT$400,000</text>

  <rect x="1358" y="841" width="492" height="172" rx="23" fill="url(#dark)"/>
  <text x="1384" y="872" class="sans eyebrow" fill="#d79069">OWNERSHIP</text>
  <text x="1384" y="906" class="serif white" font-size="21" font-weight="800">清楚分工，讓內容穩定運轉</text>
  <text x="1384" y="940" class="sans" fill="#e1d0bf" font-size="14">引弘：策略、拍攝、剪輯、發布協作、文章製作</text>
  <text x="1384" y="968" class="sans" fill="#e1d0bf" font-size="14">窩牛：專業確認、素材與權限、網站架構與優化</text>
  <text x="1384" y="997" class="sans" fill="#bfa995" font-size="12">成品、原始素材、完成文章與發布紀錄依約交付</text>

  <text x="1848" y="1055" class="sans muted" font-size="12" text-anchor="end" letter-spacing="1.5">真實專業 → 穩定產製 → 跨平台擴散 → 搜尋累積 → 市場信任</text>
</svg>
