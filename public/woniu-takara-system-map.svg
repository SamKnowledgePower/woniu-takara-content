<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">窩牛 × Takara 一年內容、發布與交接系統圖</title>
  <desc id="map-desc">窩牛本業與 Takara 代理兩條內容主線，經過策略選題、批次產製、確認發布、多管道分發及回饋校準，完成一年九十六支短影音、二十四次到場、四次季度檢核，並留下可由窩牛接手的內容資產。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#16120f" flood-opacity=".09"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M1 1 10 6 1 11" fill="none" stroke="#a95732" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .sans{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}.serif{font-family:"Songti TC","Noto Serif TC","PMingLiU",serif}.eyebrow{font-size:15px;font-weight:700;letter-spacing:.16em}.title{font-size:50px;font-weight:500;letter-spacing:-.035em}.subtitle{font-size:18px;fill:#746e65}.band{font-size:15px;font-weight:700;letter-spacing:.12em;fill:#a95732}.cardTitle{font-size:25px;font-weight:700}.cardBody{font-size:16px;fill:#746e65}.whiteBody{font-size:16px;fill:#eadfd0}.stepNo{font-size:14px;font-weight:700;letter-spacing:.1em}.stepTitle{font-size:22px;font-weight:700}.stepBody{font-size:15px;fill:#746e65}.footerTitle{font-size:18px;font-weight:700}.footerBody{font-size:15px;fill:#746e65}.metric{font-size:31px;font-weight:600}.metricLabel{font-size:13px;fill:#746e65}.chip{font-size:13px;font-weight:600}.line{fill:none;stroke:#a95732;stroke-width:2.3;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#f7f3ea"/>
  <circle cx="1715" cy="-45" r="265" fill="#f0e8d6"/>
  <circle cx="1810" cy="55" r="150" fill="none" stroke="#a95732" stroke-opacity=".18" stroke-width="2"/>

  <g class="sans">
    <text x="70" y="70" class="eyebrow" fill="#a95732">WONIU × TAKARA · ANNUAL CONTENT SYSTEM</text>
    <text id="visual-title" x="70" y="132" class="title serif" fill="#16120f">一年內容、發布與交接系統</text>
    <text x="70" y="172" class="subtitle">雙品牌內容主線，透過穩定產製、多管道發布與資產化，逐步建立窩牛可接手的內容能力。</text>
    <g transform="translate(1582 74)">
      <rect width="268" height="80" rx="16" fill="#16120f"/>
      <text x="22" y="31" class="eyebrow" fill="#d79069">12 MONTHS</text>
      <text x="22" y="59" font-size="20" font-weight="700" fill="#fff">ONE CONTENT SYSTEM</text>
    </g>

    <text x="70" y="230" class="band">01 · 雙主線內容引擎</text>
    <g filter="url(#shadow)">
      <g transform="translate(70 252)">
        <rect width="420" height="194" rx="22" fill="#16120f"/>
        <text x="28" y="36" class="stepNo" fill="#d79069">TRACK A</text>
        <text x="28" y="78" class="cardTitle serif" fill="#fff">窩牛本業</text>
        <text x="28" y="111" class="whiteBody">把案場判斷與工程經驗，</text>
        <text x="28" y="136" class="whiteBody">轉譯成消費者聽得懂的內容。</text>
        <text x="28" y="171" class="chip" fill="#e8b18f">案例拆解 · 空間決策 · 工程知識 · 信任建立</text>
      </g>
      <g transform="translate(510 252)">
        <rect width="420" height="194" rx="22" fill="#5a2d1d"/>
        <text x="28" y="36" class="stepNo" fill="#efb18e">TRACK B</text>
        <text x="28" y="78" class="cardTitle serif" fill="#fff">Takara 代理</text>
        <text x="28" y="111" class="whiteBody">把原廠優勢與產品規格，</text>
        <text x="28" y="136" class="whiteBody">轉成真實生活中的購買理由。</text>
        <text x="28" y="171" class="chip" fill="#efb18e">產品教育 · 展間體驗 · 情境應用 · 品牌差異</text>
      </g>
      <g transform="translate(950 252)">
        <rect width="420" height="194" rx="22" fill="#fff" stroke="#d9cdbc" stroke-width="1.5"/>
        <text x="28" y="36" class="stepNo" fill="#a95732">PRODUCTION</text>
        <text x="28" y="80" class="metric serif" fill="#16120f">96 支短影音</text>
        <text x="28" y="115" class="cardBody">策略、訪談、腳本、拍攝、剪輯</text>
        <text x="28" y="142" class="cardBody">與品質控管，全年彈性配置雙主線。</text>
        <rect x="28" y="159" width="118" height="23" rx="12" fill="#f0e8d6"/>
        <text x="43" y="176" class="chip" fill="#5a2d1d">內容產製中樞</text>
      </g>
      <g transform="translate(1390 252)">
        <rect width="460" height="194" rx="22" fill="#fff" stroke="#d9cdbc" stroke-width="1.5"/>
        <text x="28" y="36" class="stepNo" fill="#a95732">ONSITE &amp; REVIEW</text>
        <text x="28" y="80" class="metric serif" fill="#16120f">24 次到場</text>
        <text x="28" y="115" class="cardBody">每次約 1 小時，最長不超過 2 小時。</text>
        <text x="28" y="142" class="cardBody">同步完成訪談、拍攝、確認與帶訓。</text>
        <rect x="28" y="159" width="127" height="23" rx="12" fill="#f0e8d6"/>
        <text x="43" y="176" class="chip" fill="#5a2d1d">真實場景採集</text>
      </g>
    </g>

    <text x="70" y="500" class="band">02 · 從內容到市場的循環</text>
    <path class="line" d="M391 620 H432"/>
    <path class="line" d="M745 620 H786"/>
    <path class="line" d="M1099 620 H1140"/>
    <path class="line" d="M1453 620 H1494"/>
    <g filter="url(#shadow)">
      <g transform="translate(70 522)">
        <rect width="320" height="208" rx="20" fill="#fff" stroke="#d9cdbc"/>
        <text x="24" y="34" class="stepNo" fill="#a95732">STEP 01</text>
        <text x="24" y="73" class="stepTitle serif" fill="#16120f">策略與選題</text>
        <text x="24" y="108" class="stepBody">從案場、產品、客戶問題與</text>
        <text x="24" y="132" class="stepBody">原廠素材建立雙主線題庫。</text>
        <text x="24" y="176" class="chip" fill="#5a2d1d">週節奏 · 季度校準</text>
      </g>
      <g transform="translate(424 522)">
        <rect width="320" height="208" rx="20" fill="#fff" stroke="#d9cdbc"/>
        <text x="24" y="34" class="stepNo" fill="#a95732">STEP 02</text>
        <text x="24" y="73" class="stepTitle serif" fill="#16120f">批次拍攝製作</text>
        <text x="24" y="108" class="stepBody">集中訪談與拍攝，再完成</text>
        <text x="24" y="132" class="stepBody">腳本、剪輯與品質控管。</text>
        <text x="24" y="176" class="chip" fill="#5a2d1d">降低反覆溝通成本</text>
      </g>
      <g transform="translate(778 522)">
        <rect width="320" height="208" rx="20" fill="#fff" stroke="#d9cdbc"/>
        <text x="24" y="34" class="stepNo" fill="#a95732">STEP 03</text>
        <text x="24" y="73" class="stepTitle serif" fill="#16120f">確認後發布</text>
        <text x="24" y="108" class="stepBody">成品送交窩牛確認；窩牛</text>
        <text x="24" y="132" class="stepBody">保有最終發布確認權。</text>
        <text x="24" y="176" class="chip" fill="#5a2d1d">品牌安全檢核點</text>
      </g>
      <g transform="translate(1132 522)">
        <rect width="320" height="208" rx="20" fill="#5a2d1d"/>
        <text x="24" y="34" class="stepNo" fill="#efb18e">STEP 04</text>
        <text x="24" y="73" class="stepTitle serif" fill="#fff">四路發布協作</text>
        <text x="24" y="105" class="chip" fill="#f7f3ea">① FB／IG／YT／TikTok 影片</text>
        <text x="24" y="130" class="chip" fill="#f7f3ea">② 網站文章　③ 3 個指定社團</text>
        <text x="24" y="155" class="chip" fill="#f7f3ea">④ Threads 行銷議題操作</text>
        <text x="24" y="184" font-size="13" fill="#efb18e">確認後代上架／操作</text>
      </g>
      <g transform="translate(1486 522)">
        <rect width="364" height="208" rx="20" fill="#16120f"/>
        <text x="24" y="34" class="stepNo" fill="#d79069">STEP 05</text>
        <text x="24" y="73" class="stepTitle serif" fill="#fff">回饋校準與資產化</text>
        <text x="24" y="108" class="whiteBody">每週回報進度、每季檢核方向，</text>
        <text x="24" y="133" class="whiteBody">把有效做法沉澱為可重複流程。</text>
        <text x="24" y="176" class="chip" fill="#e8b18f">發布 → 回饋 → 下一輪選題</text>
      </g>
    </g>

    <text x="70" y="785" class="band">03 · 一年後留下的交付與能力</text>
    <g filter="url(#shadow)">
      <g transform="translate(70 808)">
        <rect width="540" height="202" rx="22" fill="#fff" stroke="#d9cdbc"/>
        <text x="26" y="37" class="footerTitle serif" fill="#16120f">年度履約基準</text>
        <g transform="translate(26 63)">
          <text x="0" y="34" class="metric serif" fill="#a95732">96</text><text x="0" y="59" class="metricLabel">支短影音</text>
          <text x="120" y="34" class="metric serif" fill="#a95732">24</text><text x="120" y="59" class="metricLabel">次到場</text>
          <text x="240" y="34" class="metric serif" fill="#a95732">4</text><text x="240" y="59" class="metricLabel">次季度檢核</text>
          <text x="360" y="34" class="metric serif" fill="#a95732">33,500</text><text x="360" y="59" class="metricLabel">元／月</text>
        </g>
        <line x1="26" y1="146" x2="514" y2="146" stroke="#e2d8ca"/>
        <text x="26" y="178" class="footerBody">每週進度回報 · 年度合計 NT$402,000</text>
      </g>
      <g transform="translate(630 808)">
        <rect width="590" height="202" rx="22" fill="#f0e8d6" stroke="#d9cdbc"/>
        <text x="26" y="37" class="footerTitle serif" fill="#16120f">四階段執行節奏</text>
        <g transform="translate(26 63)">
          <rect width="122" height="72" rx="13" fill="#fff"/><text x="14" y="25" class="chip" fill="#a95732">準備期</text><text x="14" y="49" font-size="13" fill="#746e65">定位與盤點</text>
          <rect x="136" width="122" height="72" rx="13" fill="#fff"/><text x="150" y="25" class="chip" fill="#a95732">第 1–3 月</text><text x="150" y="49" font-size="13" fill="#746e65">建立節奏</text>
          <rect x="272" width="122" height="72" rx="13" fill="#fff"/><text x="286" y="25" class="chip" fill="#a95732">第 4–6 月</text><text x="286" y="49" font-size="13" fill="#746e65">穩定產出</text>
          <rect x="408" width="130" height="72" rx="13" fill="#5a2d1d"/><text x="422" y="25" class="chip" fill="#efb18e">第 7–12 月</text><text x="422" y="49" font-size="13" fill="#fff">資產與交接</text>
        </g>
        <text x="26" y="178" class="footerBody">準備期免費贈送，不計入十二個月契約期間。</text>
      </g>
      <g transform="translate(1240 808)">
        <rect width="610" height="202" rx="22" fill="#16120f"/>
        <text x="26" y="37" class="footerTitle serif" fill="#fff">窩牛可接手的內容資產</text>
        <g transform="translate(26 64)">
          <rect width="158" height="38" rx="19" fill="#5a2d1d"/><text x="79" y="25" text-anchor="middle" class="chip" fill="#fff">選題庫</text>
          <rect x="172" width="158" height="38" rx="19" fill="#5a2d1d"/><text x="251" y="25" text-anchor="middle" class="chip" fill="#fff">素材規則</text>
          <rect x="344" width="188" height="38" rx="19" fill="#5a2d1d"/><text x="438" y="25" text-anchor="middle" class="chip" fill="#fff">發布流程</text>
          <rect y="52" width="244" height="38" rx="19" fill="#f0e8d6"/><text x="122" y="77" text-anchor="middle" class="chip" fill="#5a2d1d">教學紀錄與模板</text>
          <rect x="258" y="52" width="274" height="38" rx="19" fill="#f0e8d6"/><text x="395" y="77" text-anchor="middle" class="chip" fill="#5a2d1d">權限盤點與內部帶訓</text>
        </g>
        <text x="26" y="178" font-size="15" fill="#d8cdbf">目標：讓內容從外部代操，逐步成為內部日常能力。</text>
      </g>
    </g>
  </g>
</svg>
